<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071019" />
  <title>Freshwater Surf Boat Program — Overlay Preview</title>
  <style>
    /* Page reset only for the overlay page itself (iframe is a separate document) */
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#071019;color:#fff}
    /* iframe hosting the original app */
    #fwsb-iframe { position:fixed; inset:0; width:100%; height:100%; border:0; z-index:1; background:#071019; }
    /* overlay root (completely separate from iframe) */
    .fwsb-overlay-root{position:fixed;inset:0;pointer-events:none;z-index:2147483647}
    .fwsb-root{pointer-events:auto;position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;z-index:2147483648}
    .fwsb-container{max-width:1280px;width:100%;padding-left:12px;padding-right:12px;box-sizing:border-box}
    .fwsb-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(7,16,24,0.6),rgba(7,10,14,0.18));backdrop-filter:blur(4px);border-bottom:1px solid rgba(255,255,255,0.03);height:64px;border-radius:0;margin-top:8px}
    .fwsb-brand{display:flex;align-items:center;gap:12px}
    .fwsb-logo{width:44px;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,0.06);display:grid;place-items:center;background:rgba(255,255,255,0.02);font-weight:800}
    .fwsb-primary{font-size:16px;font-weight:700;letter-spacing:0.6px}
    .fwsb-secondary{font-size:11px;opacity:0.9;margin-top:2px}
    .fwsb-menu-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:10px;color:#fff;cursor:pointer}
    .fwsb-bottom-nav{display:flex;justify-content:space-around;align-items:center;padding:10px 8px;background:linear-gradient(180deg,rgba(7,10,14,0.95),rgba(7,10,14,0.88));border-top:1px solid rgba(255,255,255,0.03);width:100%;box-sizing:border-box}
    .fwsb-bottom-inner{max-width:1280px;margin:0 auto;display:flex;gap:12px;justify-content:center}
    .fwsb-nav-btn{background:transparent;border:none;color:#cbd5e1;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer}
    .fwsb-nav-btn.active{color:#fff;font-weight:700}
    .fwsb-drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:8vh;max-height:70vh;background:linear-gradient(180deg,#071019,#0b1218);width:720px;border-radius:12px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,0.6);z-index:2147483649;overflow:auto;display:none}
    .fwsb-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2147483646;display:none}
    .fwsb-menu-item{display:block;padding:10px 8px;border-radius:8px;color:#e6eef6;background:transparent;border:0;text-align:left;width:100%;cursor:pointer}
    .fwsb-card{background:rgba(255,255,255,0.03);padding:12px;border-radius:10px;margin-bottom:12px}
    .fwsb-form-row{display:flex;gap:8px;align-items:center}
    .fwsb-input, .fwsb-select{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:#fff;padding:8px;border-radius:8px}
    .fwsb-primary-btn{background:#0ea5a3;border:none;padding:8px 12px;border-radius:8px;color:#042024;cursor:pointer}
    .fwsb-small{font-size:12px;opacity:0.9}
    .fwsb-admin-trigger{margin-left:8px}
    /* small responsive adjustments */
    @media (max-width:900px){
      .fwsb-drawer{left:0;right:0;transform:none;width:auto;border-radius:14px}
      .fwsb-header{padding:14px;height:72px}
    }
  </style>
</head>
<body>
  <!-- iframe to host the original app (isolated) -->
  <iframe id="fwsb-iframe" src="https://raw.githubusercontent.com/robm8213/FRESHWATER-SURFBOAT-PROGRAM-/feature/fwsb-unified-index/index.html"></iframe>

  <!-- overlay root (isolated from iframe) -->
  <div class="fwsb-overlay-root" aria-hidden="false">
    <div class="fwsb-root">
      <div class="fwsb-container">
        <header class="fwsb-header" role="banner">
          <div class="fwsb-brand">
            <div class="fwsb-logo">FW</div>
            <div>
              <div class="fwsb-primary" id="fwsb-primary">OPEN MEN • [CREW NAME] PROGRAM</div>
              <div class="fwsb-secondary" id="fwsb-secondary">2026/27 • Block 1 • Week 2 • Pre-Season</div>
            </div>
          </div>
          <div>
            <button id="fwsb-athlete-menu-btn" class="fwsb-menu-btn" aria-haspopup="true">Menu ▾</button>
            <button id="fwsb-admin-btn" class="fwsb-menu-btn fwsb-admin-trigger">Admin</button>
          </div>
        </header>
      </div>

      <nav class="fwsb-bottom-nav" aria-label="Primary">
        <div class="fwsb-bottom-inner">
          <button class="fwsb-nav-btn" data-page="home">Home</button>
          <button class="fwsb-nav-btn" data-page="week">Week</button>
          <button class="fwsb-nav-btn" data-page="athletes">Athletes</button>
          <button class="fwsb-nav-btn" data-page="testing">Testing</button>
          <button class="fwsb-nav-btn" id="fwsb-more-btn">More ▾</button>
        </div>
      </nav>
    </div>
  </div>

  <!-- overlay dim and drawers (hidden by default) -->
  <div id="fwsb-overlay-dim" class="fwsb-overlay" role="presentation"></div>

  <div id="fwsb-tools-drawer" class="fwsb-drawer" role="dialog" aria-hidden="true">
    <h4>Team Tools</h4>
    <button class="fwsb-menu-item" data-tool="today">Today / Next Session</button>
    <button class="fwsb-menu-item" data-tool="messages">Team Messages</button>
    <button class="fwsb-menu-item" data-tool="crew-availability">Crew Availability</button>
    <button class="fwsb-menu-item" data-tool="attendance">Attendance</button>
    <button class="fwsb-menu-item" data-tool="carnival-availability">Carnival Availability</button>
    <button class="fwsb-menu-item" data-tool="notifications">Notifications</button>
    <button class="fwsb-menu-item" data-tool="checkin">Check-In</button>
    <button class="fwsb-menu-item" data-tool="athlete-history">Athlete History</button>
    <button class="fwsb-menu-item" data-tool="training-blocks">Training Blocks</button>
    <button class="fwsb-menu-item" data-tool="weeks-ahead">Weeks Ahead</button>
    <button class="fwsb-menu-item" data-tool="carnivals">Carnivals</button>
    <button class="fwsb-menu-item" data-tool="announcements">Announcements</button>
    <button class="fwsb-menu-item" data-tool="garmin">Garmin (integration test)</button>
    <button class="fwsb-menu-item" data-tool="apple">Apple Health (integration test)</button>
    <button class="fwsb-menu-item" data-tool="settings">Settings</button>
  </div>

  <div id="fwsb-athlete-drawer" class="fwsb-drawer" role="dialog" aria-hidden="true">
    <h4>Athlete Menu</h4>
    <button class="fwsb-menu-item" data-action="messages">Team Messages</button>
    <button class="fwsb-menu-item" data-action="notifications">Notifications</button>
    <button class="fwsb-menu-item" data-action="garmin">Garmin (test)</button>
    <button class="fwsb-menu-item" data-action="apple">Apple Health (test)</button>
    <button class="fwsb-menu-item" data-action="checkin">Check-In / Today</button>
    <button class="fwsb-menu-item" data-action="history">Training History</button>
    <button class="fwsb-menu-item" data-action="weeks">Weeks Ahead</button>
    <button class="fwsb-menu-item" data-action="carnivals">Carnivals</button>
  </div>

  <div id="fwsb-admin-modal" class="fwsb-drawer" role="dialog" aria-hidden="true" style="max-height:80vh;">
    <h4>Admin: Crews & Divisions</h4>
    <div id="fwsb-admin-body"></div>
  </div>

  <script>
    // Overlay behavior + demo admin (localStorage-backed) — runs in parent page, iframe isolated
    (function(){
      const STORE_KEY = 'fwsb_demo_store_v1';
      function uid(prefix='id'){ return prefix + Math.random().toString(36).slice(2,9); }
      function loadStore(){
        try{ const s = localStorage.getItem(STORE_KEY); if(s) return JSON.parse(s); }catch(e){}
        const seed = {
          divisions:[
            {id:'div-open-men',name:'Open Men',crews:[{id:'crew-open-a',name:'Freshwater A',coachId:'coach-1'},{id:'crew-open-b',name:'Freshwater B',coachId:null}]},
            {id:'div-open-women',name:'Open Women',crews:[{id:'crew-openw-a',name:'Freshwater Women',coachId:null}]}
          ],
          coaches:[{id:'coach-1',name:'Rob Coach',token:null}],
          athletes:[], links:{}
        };
        localStorage.setItem(STORE_KEY, JSON.stringify(seed));
        return seed;
      }
      function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
      let store = loadStore();

      // session (simulated via ?role=coach&token=... on the overlay url)
      const params = new URLSearchParams(location.search);
      const role = params.get('role');
      const token = params.get('token');
      let session = { role:null, coachId:null, crewId:null, athleteId:null };
      if(role==='coach' && token){
        const mapping = store.links && store.links.coachTokens || {};
        const crewId = mapping[token];
        if(crewId){ session.role='coach'; session.coachToken = token; session.crewId = crewId; const coach = store.coaches.find(c=>c.token===token); if(coach) session.coachId = coach.id; }
      }
      if(role==='athlete'){ session.role='athlete'; session.athleteId = params.get('athleteId') || null; }

      // DOM refs
      const overlayDim = document.getElementById('fwsb-overlay-dim');
      const toolsDrawer = document.getElementById('fwsb-tools-drawer');
      const athleteDrawer = document.getElementById('fwsb-athlete-drawer');
      const adminModal = document.getElementById('fwsb-admin-modal');
      const moreBtn = document.getElementById('fwsb-more-btn');
      const menuBtn = document.getElementById('fwsb-athlete-menu-btn');
      const adminBtn = document.getElementById('fwsb-admin-btn');

      function updateHeader(){
        const primary = document.getElementById('fwsb-primary');
        const secondary = document.getElementById('fwsb-secondary');
        if(session.role==='coach' && session.crewId){
          const crew = findCrewById(session.crewId);
          primary.textContent = 'OPEN MEN • ' + (crew?.name || '[CREW]') + ' PROGRAM';
        } else {
          primary.textContent = 'OPEN MEN • [CREW NAME] PROGRAM';
        }
        secondary.textContent = '2026/27 • Block 1 • Week 2 • Pre-Season / Base Building';
      }

      function findDivisionById(id){ return store.divisions.find(d=>d.id===id); }
      function findCrewById(id){ for(const d of store.divisions){ const c = d.crews.find(x=>x.id===id); if(c) return Object.assign({}, c, {divisionId:d.id, divisionName:d.name}); } return null; }
      function findCoachById(id){ return store.coaches.find(c=>c.id===id); }

      function open(ele){ if(!ele) return; ele.style.display='block'; ele.setAttribute('aria-hidden','false'); overlayDim.style.display='block'; }
      function close(ele){ if(!ele) return; ele.style.display='none'; ele.setAttribute('aria-hidden','true'); overlayDim.style.display='none'; }

      moreBtn.addEventListener('click', ()=>{ if(toolsDrawer.style.display==='block'){ close(toolsDrawer); } else open(toolsDrawer); });
      menuBtn.addEventListener('click', ()=>{ if(athleteDrawer.style.display==='block'){ close(athleteDrawer); } else open(athleteDrawer); });
      adminBtn.addEventListener('click', ()=> open(adminModal));
      overlayDim.addEventListener('click', ()=> { close(toolsDrawer); close(athleteDrawer); close(adminModal); });

      document.querySelectorAll('.fwsb-nav-btn').forEach(b=> b.addEventListener('click', ()=>{
        document.querySelectorAll('.fwsb-nav-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      }));

      // Tools/actions placeholder handler
      document.addEventListener('click', function(e){
        const it = e.target.closest('.fwsb-menu-item');
        if(!it) return;
        const action = it.dataset.action || it.dataset.tool;
        close(toolsDrawer); close(athleteDrawer);
        if(action==='messages') return alert('Team Messages — placeholder');
        if(action==='notifications') return alert('Notifications — placeholder');
        if(action==='garmin' || action==='apple') return alert(action.toUpperCase() + ' — integration/test area');
        return alert((action||'Action') + ' — placeholder');
      }, false);

      // Admin UI render
      function renderAdminBody(){
        const body = document.getElementById('fwsb-admin-body'); body.innerHTML = '';

        const reg = document.createElement('div'); reg.className = 'fwsb-card';
        const headerRow = document.createElement('div');
        headerRow.style.display='flex';
        headerRow.style.justifyContent='space-between';
        headerRow.style.alignItems='center';
        headerRow.innerHTML = "<strong>Division | Crew Name | Coach</strong><button id='fwsb-add-division' class='fwsb-primary-btn'>Add Division</button>";
        reg.appendChild(headerRow);

        const table = document.createElement('div'); table.style.marginTop='12px';
        store.divisions.forEach(div=>{
          div.crews.forEach(crew=>{
            const row = document.createElement('div'); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.alignItems='center'; row.style.gap='8px'; row.style.padding='6px 0';
            const left = document.createElement('div'); left.innerHTML = "<div style='font-weight:700'>" + div.name + " • " + crew.name + "</div><div class='fwsb-small'>ID: " + crew.id + "</div>";
            const coachName = findCoachById(crew.coachId)?.name || '<em>Unassigned</em>';
            const right = document.createElement('div'); right.innerHTML = "<span class='fwsb-small'>Coach: " + coachName + "</span> <button class='fwsb-edit-crew' data-id='" + crew.id + "'>Edit</button> <button class='fwsb-del-crew' data-id='" + crew.id + "'>Delete</button>";
            row.appendChild(left); row.appendChild(right); table.appendChild(row);
          });
        });
        reg.appendChild(table); body.appendChild(reg);

        const coachCard = document.createElement('div'); coachCard.className='fwsb-card';
        coachCard.innerHTML = "<strong>Coaches</strong><div id='fwsb-coach-list'></div><div style='margin-top:8px'><input id='fwsb-new-coach' class='fwsb-input' placeholder='Coach name'/> <button id='fwsb-add-coach' class='fwsb-primary-btn'>Add Coach</button></div>";
        body.appendChild(coachCard);

        const createCard = document.createElement('div'); createCard.className='fwsb-card';
        createCard.innerHTML = "<strong>Create Crew</strong><div style='margin-top:8px' class='fwsb-form-row'><select id='fwsb-select-division' class='fwsb-select'></select><input id='fwsb-crew-name' class='fwsb-input' placeholder='Crew name' /><button id='fwsb-create-crew' class='fwsb-primary-btn'>Create</button></div>";
        body.appendChild(createCard);

        document.getElementById('fwsb-add-division').onclick = ()=>{ const n = prompt('Division name'); if(n){ store.divisions.push({id:uid('div-'), name:n, crews:[]}); saveStore(store); renderAdminBody(); }};

        const coachListElem = document.getElementById('fwsb-coach-list'); coachListElem.innerHTML = '';
        store.coaches.forEach(c=>{ const el = document.createElement('div'); el.innerHTML = c.name + " <button class='fwsb-gen-link' data-id='" + c.id + "'>Generate link</button>"; coachListElem.appendChild(el); });

        document.getElementById('fwsb-add-coach').onclick = ()=>{ const name = document.getElementById('fwsb-new-coach').value.trim(); if(!name) return alert('Enter coach name'); const id = uid('coach-'); store.coaches.push({id:id, name:name, token:null}); saveStore(store); renderAdminBody(); }

        const sel = document.getElementById('fwsb-select-division'); sel.innerHTML = '';
        store.divisions.forEach(d=>{ const op = document.createElement('option'); op.value = d.id; op.textContent = d.name; sel.appendChild(op); });
        document.getElementById('fwsb-create-crew').onclick = ()=>{ const divId = sel.value; const name = document.getElementById('fwsb-crew-name').value.trim(); if(!name) return alert('Enter crew name'); const div = findDivisionById(divId); const crewId = uid('crew-'); div.crews.push({id:crewId, name:name, coachId:null}); saveStore(store); renderAdminBody(); }

        Array.from(document.querySelectorAll('.fwsb-edit-crew')).forEach(btn=>btn.onclick = ()=>{ const id = btn.dataset.id; const crew = findCrewById(id); const newName = prompt('Crew name', crew.name); if(newName){ const div = findDivisionById(crew.divisionId); const target = div.crews.find(c=>c.id===id); target.name = newName; saveStore(store); renderAdminBody(); }});
        Array.from(document.querySelectorAll('.fwsb-del-crew')).forEach(btn=>btn.onclick = ()=>{ const id = btn.dataset.id; if(!confirm('Delete crew?')) return; for(const d of store.divisions){ const idx = d.crews.findIndex(c=>c.id===id); if(idx>=0){ d.crews.splice(idx,1); saveStore(store); renderAdminBody(); return; } } });

        Array.from(document.querySelectorAll('.fwsb-gen-link')).forEach(btn=>btn.onclick = ()=>{ const id = btn.dataset.id; const coach = store.coaches.find(c=>c.id===id); if(!coach) return; if(!coach.token) coach.token = uid('t-'); const crewId = prompt('Enter crew id to assign coach to (or leave blank to copy token):'); if(crewId){ store.links = store.links||{}; store.links.coachTokens = store.links.coachTokens || {}; store.links.coachTokens[coach.token] = crewId; const c = findCrewById(crewId); if(c){ const div = findDivisionById(c.divisionId); const cr = div.crews.find(x=>x.id===crewId); cr.coachId = coach.id; } } saveStore(store); alert('Coach token: '+coach.token + "\nUse link: " + location.origin + location.pathname + "?role=coach&token=" + coach.token); });
      }

      // show division->crew selector on load if not coach
      function showDivisionCrewSelector(){
        const modal = document.createElement('div'); modal.className = 'fwsb-drawer'; modal.style.maxHeight='60vh'; modal.id='fwsb-select-modal';
        modal.innerHTML = "<h4>Select Division → Crew</h4><div class='fwsb-card'><div class='fwsb-form-row'><select id='fwsb-select-division-sel' class='fwsb-select'></select><select id='fwsb-select-crew-sel' class='fwsb-select'></select></div><div style='margin-top:10px'><button id='fwsb-select-crew-enter' class='fwsb-primary-btn'>Enter Crew</button> <button id='fwsb-select-crew-skip' class='fwsb-menu-item'>Skip</button></div></div>";
        document.body.appendChild(modal);
        const selD = document.getElementById('fwsb-select-division-sel'); const selC = document.getElementById('fwsb-select-crew-sel');
        store.divisions.forEach(d=>{ const op = document.createElement('option'); op.value = d.id; op.textContent = d.name; selD.appendChild(op); });
        function populateCrews(){ const d = findDivisionById(selD.value); selC.innerHTML=''; d.crews.forEach(c=>{ const op=document.createElement('option'); op.value=c.id; op.textContent=c.name; selC.appendChild(op); }); }
        selD.addEventListener('change', populateCrews); populateCrews();
        document.getElementById('fwsb-select-crew-enter').onclick = ()=>{ const crewId = selC.value; session.crewId = crewId; updateHeader(); modal.remove(); }
        document.getElementById('fwsb-select-crew-skip').onclick = ()=>{ modal.remove(); }
      }

      // initial render
      updateHeader();
      if(!session.crewId && session.role !== 'coach'){ setTimeout(showDivisionCrewSelector, 400); }
      renderAdminBody();
      window.FWSB_DEMO = {store: store, save: ()=>{ saveStore(store); renderAdminBody(); }, session: session};
    })();
  </script>
</body>
</html>
