<!doctype html>
<html lang="en"><head>

<style>

</style></head><body>
<div id="boot" class="ready"><div class="readyBox"><div class="logo">FW</div><h1>Freshwater Surf Boat Program</h1><p>Freshwater Surf Boat Program</p><span class="badge">FRESHWATER SURF BOAT PROGRAM</span></div></div>
<script>
(async function(){
 if(location.protocol==='file:'||location.protocol==='blob:')return;
 const boot=document.getElementById('boot');
 boot.innerHTML='<div class="readyBox"><div class="spinner"></div><h1>Loading Freshwater Surf Boat Program…</h1><p>Loading your program…</p></div>';
 try{
  const r=await fetch('https://raw.githubusercontent.com/robm8213/FRESHWATER-SURFBOAT-PROGRAM-/957d3ed72e83580e560d30095bb6b87bb61ece16/index.html',{cache:'no-store'});
  if(!r.ok)throw new Error('Base app returned '+r.status);
  let full=await r.text();
  const addon=decodeURIComponent(escape(atob('PHNjcmlwdD4KKGZ1bmN0aW9uKCl7Cid1c2Ugc3RyaWN0JzsKY29uc3QgS0VZPSdmd19mZWF0dXJlX3BhY2tfdjEnOwpjb25zdCBET1c9WydTdW5kYXknLCdNb25kYXknLCdUdWVzZGF5JywnV2Vkbm[...])));
  full=full.includes('</body>')?full.replace('</body>',addon+'\n</body>'):full+addon;
  document.open();document.write(full);document.close();
 }catch(err){
  boot.innerHTML='<div class="readyBox"><div class="logo">FW</div><h1>Freshwater app could not load</h1><p>'+String(err.message||err)+'</p><p>Refresh once and send a screenshot if it remains here.</p></div>';
 }
})();
</script>
<script>
(function(){
'use strict';
function isVisible(el){
  if(!el) return false;
  const s=getComputedStyle(el);
  const r=el.getBoundingClientRect();
  return s.display!=='none' && s.visibility!=='hidden' && r.width>0 && r.height>0;
}
function sidebarLayoutIsActive(){
  const layout=document.querySelector('.layout');
  const sidebar=document.querySelector('.sidebar');
  return window.innerWidth>760 && isVisible(layout) && isVisible(sidebar);
}
function installStyles(){
  if(document.getElementById('fwUnifiedDesktopStyles')) return;
  const st=document.createElement('style');
  st.id='fwUnifiedDesktopStyles';
  st.textContent=`
    @media(min-width:761px){
      body.fwDesktopWide .layout{display:block !important;grid-template-columns:1fr !important;}
      body.fwDesktopWide .sidebar{display:none !important;}
      body.fwDesktopWide .content{width:min(980px, calc(100vw - 40px)) !important;max-width:980px !important;min-width:0 !important;margin:0 auto !important;padding:20px 20px 100px !important;}
      body.fwDesktopWide .screen, body.fwDesktopWide .screen.active{width:100% !important;max-width:none !important;min-width:0 !important;}
      body.fwDesktopWide .card, body.fwDesktopWide .fwNext, body.fwDesktopWide .fwFeatureStrip, body.fwDesktopWide .dayCard{width:100% !important;max-width:none !important;}
      body.fwDesktopWide .mobilebar{display:grid !important;grid-template-columns:repeat(5,1fr) !important;position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;width:100% !important;padding:10px 8px !important;box-sizing:border-box !important;background:linear-gradient(180deg,rgba(7,10,14,0.95),rgba(7,10,14,0.88)) !important;border-top:1px solid rgba(255,255,255,0.03) !important;}
      body.fwDesktopWide .mobilebar button{display:block !important;border:0 !important;background:transparent !important;color:#e4e8eb !important;font:inherit !important;font-size:13px !important;padding:8px 12px !important;border-radius:8px !important;cursor:pointer !important}
      body.fwDesktopWide .mobilebar button span{display:block !important;font-size:20px !important;line-height:1.1 !important;margin-bottom:2px !important;}
      body.fwDesktopWide .mobilebar button.active{color:#ff5a63 !important;font-weight:800 !important;}
    }
  `;
  document.head.appendChild(st);
}
function apply(){
  try{
    installStyles();
   document.body.classList.toggle('fwDesktopWide', window.innerWidth>760);

  }catch(e){}
}
setTimeout(apply,300);
setTimeout(apply,800);
setTimeout(apply,1600);
setInterval(apply,2000);
window.addEventListener('resize',apply);
window.addEventListener('focus',apply);
new MutationObserver(apply).observe(document.documentElement,{childList:true, subtree:true, attributes:true, attributeFilter:['class','style']});
(function(){
  var st=document.createElement('style');
  st.textContent='#fwPreLiveAthlete{display:none !important;}';
  document.head.appendChild(st);
})();
(function(){
  function addDashboardCards(){
    var dash=document.getElementById('dashboard');
    if(!dash || document.getElementById('fwDashboardMsgCards')) return;
    var wrap=document.createElement('div');
    wrap.id='fwDashboardMsgCards';
    wrap.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;';
    wrap.innerHTML='<button class="moreChoice" style="text-align:left;background:#0d090a;border:1px solid var(--line);border-radius:13px;padding:13px;color:#fff;font:inherit;cursor:pointer;" onclick="alert(\'placeholder\')">Message</button>';
    var target=dash.querySelector('.divisionIdentity')||dash.querySelector('h1')||dash.firstElementChild;
    if(target) target.insertAdjacentElement('afterend', wrap);
    else dash.appendChild(wrap);
    
  }

  setTimeout(addDashboardCards,1000);
  setInterval(addDashboardCards,2000);
})();


})();
(function(){
  function getCrews(){
    try{ return JSON.parse(localStorage.getItem('fw_live_crew_config_v1')||'{}').crews||{}; }catch(e){ return {}; }
  }
  function populateSelect(selectEl, crews){
    if(!selectEl || !crews.length) return;
    var prev = selectEl.value;
    selectEl.innerHTML = crews.map(function(c){ return '<option value="'+c.id+'">'+c.name+'</option>'; }).join('');
    if(crews.some(function(c){return c.id===prev})) selectEl.value = prev;
  }
  function refresh(divId, teamId){
    var divSel=document.getElementById(divId), teamSel=document.getElementById(teamId);
    if(!divSel||!teamSel) return;
    var crews=(getCrews()[divSel.value])||[];
    populateSelect(teamSel, crews);
  }
  function wireUp(divId, teamId){
    var divSel=document.getElementById(divId);
    if(divSel && !divSel.dataset.fwWired){
      divSel.addEventListener('change', function(){ refresh(divId, teamId); });
      divSel.dataset.fwWired='1';
    }
  }
  function apply(){
    try{
      wireUp('masterDivisionSelect','masterTeamSelect');
      wireUp('coachLinkDivision','coachLinkTeam');
      var panel=document.getElementById('masterControlPanel');
      if(panel && getComputedStyle(panel).display!=='none'){
        refresh('masterDivisionSelect','masterTeamSelect');
        refresh('coachLinkDivision','coachLinkTeam');
      }
    }catch(e){}
  }
 // setInterval(apply,1000);

})();
(function(){
  function getCrews(){
    try{ return JSON.parse(localStorage.getItem('fw_live_crew_config_v1')||'{}').crews||{}; }catch(e){ return {}; }
  }
  function esc(s){ return String(s).replace(/[&<>\"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]; }); }

  function correctOpenTeamPicker(name){
    var token=new URLSearchParams(location.search).get("athlete");
    if(token && typeof athleteInviteDivision!=='undefined' && athleteInviteDivision && divisionSlug(name)!==athleteInviteDivision){
      var assigned=FRESHWATER_DIVISIONS.find(function(x){return divisionSlug(x)===athleteInviteDivision})||"your assigned division";
      alert('Your athlete link is for '+assigned+'. Tap '+assigned+' to open your training.');
      return;
    }
    pendingAccessDivision=name;
    document.getElementById("teamAccessDivision").textContent=name;
    var assignedTeam=(token && typeof athleteInviteTeam!=='undefined' && athleteInviteTeam)?athleteInviteTeam:"";
    var crews=(getCrews()[name])||[];
    var box=document.getElementById("teamAccessChoices");
    if(crews.length){
      box.innerHTML = crews.map(function(c){
        var disabled = assignedTeam && c.id!==assignedTeam;
        return '<button class="teamChoice" onclick="chooseAccessTeam(\''+c.id.replace(/'/g,"\\'")+'\')" '+(disabled?'style="opacity:.42"':'')+'><b>'+esc(c.name)+'</b><small>'+(disabled?'Your athl[...]
      }).join('');
    } else {
      box.innerHTML = FRESHWATER_TEAMS.map(function(t){
        var disabled = assignedTeam && t!==assignedTeam;
        return '<button class="teamChoice" onclick="chooseAccessTeam(\''+t+'\')" '+(disabled?'style="opacity:.42"':'')+'><b>'+esc(t)+'</b><small>'+(disabled?'Your athlete link is assigned to '+es[...]
      }).join('');
    }
    document.getElementById("teamAccessNotice").innerHTML = token && assignedTeam ? 'Your personal athlete link is assigned to <b>'+esc(name)+' — '+esc(assignedTeam)+'</b>.' : 'TEST MODE: Choos[...]
    showLayer("teamAccessPicker");
  }

  function enforce(){
    if(window.openTeamPicker !== correctOpenTeamPicker){
      window.openTeamPicker = correctOpenTeamPicker;
    }
  }
  enforce();
  setInterval(enforce, 300);
})();


(function(){
  // REPLACED: safer dashboard title updater to avoid placeholder flicker
  (function(){
    var latestRenderToken = 0;

    function safeApply(){
      try{
        var di = document.getElementById('dashboardDivisionIdentity');
        if(!di) return;

        function setLabel(name){
          di.textContent = String(currentDivision).toUpperCase() + ' • ' + String(name).toUpperCase() + ' PROGRAM';
          di.style.fontSize = '15px';
        }

        var cfg = JSON.parse(localStorage.getItem('fw_live_crew_config_v1')||'{}');
        var crews = (cfg.crews && cfg.crews[currentDivision]) || [];
        var crew = crews.find(function(c){ return c.id === currentTeam; });

        if (crew && crew.name) {
          setLabel(crew.name);
          return;
        }

        // Name not available synchronously — poll briefly, but DO NOT overwrite existing label with a placeholder
        var token = ++latestRenderToken;
        var start = Date.now();
        (function poll(){
          if (token !== latestRenderToken) return; // a newer render happened
          var cfg2 = JSON.parse(localStorage.getItem('fw_live_crew_config_v1')||'{}');
          var crews2 = (cfg2.crews && cfg2.crews[currentDivision]) || [];
          var crew2 = crews2.find(function(c){ return c.id === currentTeam; });
          if (crew2 && crew2.name) {
            window.requestAnimationFrame(function(){
              if (token !== latestRenderToken) return;
              setLabel(crew2.name);
            });
            return;
          }
          if (Date.now() - start < 800) {
            setTimeout(poll, 50);
          }
          // otherwise give up silently — do not set a placeholder
        })();

      }catch(e){}
    }

    var oldRenderDashboard = window.renderDashboard;
    if (typeof oldRenderDashboard === 'function' && !oldRenderDashboard.__fwWrapped) {
      window.renderDashboard = function(){
        var r = oldRenderDashboard.apply(this, arguments);
        safeApply();
        return r;
      };
      window.renderDashboard.__fwWrapped = true;
    }
    safeApply();
  })();
})();


})();
</script>
