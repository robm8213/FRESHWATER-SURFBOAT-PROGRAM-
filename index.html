<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>Freshwater Surf Boat Program</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#071019;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif
}
.ready{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px;
  text-align:center;
  background:linear-gradient(180deg,#071019,#170708)
}
.readyBox{
  max-width:540px;
  width:100%;
  background:#171012;
  border:1px solid #3a2629;
  border-radius:18px;
  padding:22px
}
.logo{
  width:54px;
  height:54px;
  border:3px solid #fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:1000;
  margin:0 auto 14px
}
h1{font-size:24px;margin:0 0 8px}
p{color:#c8babc;line-height:1.5;margin:7px 0}
.spinner{
  width:38px;
  height:38px;
  border:4px solid #3a2629;
  border-top-color:#a42933;
  border-radius:50%;
  margin:0 auto 16px;
  animation:s 1s linear infinite
}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="boot" class="ready">
  <div class="readyBox">
    <div class="logo">FW</div>
    <h1>Freshwater Surf Boat Program</h1>
    <p>Loading your program…</p>
  </div>
</div>

<script>
(async function(){
  if(location.protocol==='file:' || location.protocol==='blob:') return;

  const boot=document.getElementById('boot');

  boot.innerHTML=
    '<div class="readyBox">' +
    '<div class="spinner"></div>' +
    '<h1>Loading Freshwater Surf Boat Program…</h1>' +
    '<p>Loading your program…</p>' +
    '</div>';

  try{
    const r=await fetch(
      'https://raw.githubusercontent.com/robm8213/FRESHWATER-SURFBOAT-PROGRAM-/24f3622264f5657b6019ecc1dbfac56078e180a0/index.html',
      {cache:'no-store'}
    );

    if(!r.ok){
      throw new Error('Base app returned '+r.status);
    }

    const full=await r.text();

    document.open();
    document.write(full);
    document.close();

  }catch(e){
    console.error(e);

    boot.innerHTML=
      '<div class="readyBox">' +
      '<h1>Freshwater Surf Boat Program</h1>' +
      '<p>The program could not load. Please refresh the page.</p>' +
      '</div>';
  }
})();
</script>

</body>
</html>
