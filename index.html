<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>Freshwater Surf Boat Program</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#071019;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif
}

.ready{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px;
  text-align:center;
  background:linear-gradient(180deg,#071019,#170708)
}

.readyBox{
  max-width:540px;
  width:100%;
  background:#171012;
  border:1px solid #3a2629;
  border-radius:18px;
  padding:22px
}

.logo{
  width:54px;
  height:54px;
  border:3px solid #fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:1000;
  margin:0 auto 14px
}

h1{
  font-size:24px;
  margin:0 0 8px
}

p{
  color:#c8babc;
  line-height:1.5;
  margin:7px 0
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #3a2629;
  border-top-color:#a42933;
  border-radius:50%;
  margin:0 auto 16px;
  animation:s 1s linear infinite
}

@keyframes s{
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="boot" class="ready">
  <div class="readyBox">
    <div class="logo">FW</div>
    <h1>Freshwater Surf Boat Program</h1>
    <p>Loading your program…</p>
  </div>
</div>

<script>
(async function(){

  const boot=document.getElementById('boot');

  boot.innerHTML=
    '<div class="readyBox">'+
    '<div class="spinner"></div>'+
    '<h1>Loading Freshwater Surf Boat Program…</h1>'+
    '<p>Loading your program…</p>'+
    '</div>';

  try{

    const response=await fetch(
      'https://raw.githubusercontent.com/robm8213/FRESHWATER-SURFBOAT-PROGRAM-/8b2c5ed1de5faf4eccb0fbc0e957843b5140f11f/index.html',
      {cache:'no-store'}
    );

    if(!response.ok){
      throw new Error('Working app returned '+response.status);
    }

    let source=await response.text();

    const patch=`<script>
(function(){
'use strict';

function installBottomTabFix(){

  if(document.getElementById('fwBottomTabFinalFix')) return;

  const style=document.createElement('style');

  style.id='fwBottomTabFinalFix';

  style.textContent=\`

    .mobilebar{
      visibility:visible!important;
      opacity:1!important;
      pointer-events:auto!important;
      background:#05070a!important;
      border-top:1px solid #34383d!important;
      box-shadow:0 -8px 22px rgba(0,0,0,.40)!important;
      color:#fff!important;
    }

    .mobilebar button{
      visibility:visible!important;
      opacity:1!important;
      pointer-events:auto!important;
      color:#d9dfe3!important;
      font-weight:800!important;
    }

    .mobilebar button span{
      visibility:visible!important;
      opacity:1!important;
      color:#f3f6f8!important;
    }

    .mobilebar button.active,
    .mobilebar button.active span{
      color:#ff5a64!important;
    }

    @media(min-width:761px){

      body.fwCoachDesktopMobile .mobilebar,
      body.fwAthleteDesktopWide .mobilebar{

        display:grid!important;

        grid-template-columns:
          repeat(5,minmax(0,1fr))!important;

        position:fixed!important;

        left:0!important;
        right:0!important;
        bottom:0!important;

        width:100%!important;

        min-height:76px!important;

        padding:
          9px
          16px
          10px!important;

        column-gap:8px!important;

        align-items:center!important;

        z-index:2147483000!important;
      }


      body.fwCoachDesktopMobile .mobilebar button,
      body.fwAthleteDesktopWide .mobilebar button{

        display:flex!important;

        flex-direction:column!important;

        align-items:center!important;

        justify-content:center!important;

        min-width:0!important;

        min-height:54px!important;

        padding:
          6px
          4px!important;

        border:0!important;

        background:transparent!important;

        border-radius:10px!important;

        font-size:13px!important;

        line-height:1.1!important;

        text-align:center!important;

        white-space:nowrap!important;
      }


      body.fwCoachDesktopMobile .mobilebar button span,
      body.fwAthleteDesktopWide .mobilebar button span{

        display:block!important;

        font-size:20px!important;

        line-height:1!important;

        margin:
          0
          0
          4px!important;
      }


      body.fwCoachDesktopMobile .content,
      body.fwAthleteDesktopWide .content{

        padding-bottom:
          128px!important;
      }


      body.fwCoachDesktopMobile .screen.active,
      body.fwAthleteDesktopWide .screen.active{

        padding-bottom:
          14px!important;
      }
    }

  \`;

  document.head.appendChild(style);
}


function keepTabsVisible(){

  installBottomTabFix();

  if(window.innerWidth<=760) return;

  const converted=

    document.body.classList.contains(
      'fwCoachDesktopMobile'
    )

    ||

    document.body.classList.contains(
      'fwAthleteDesktopWide'
    );


  if(!converted) return;


  const bar=
    document.querySelector('.mobilebar');


  if(!bar) return;


  bar.style.display='grid';

  bar.style.visibility='visible';

  bar.style.opacity='1';

  bar.style.pointerEvents='auto';
}


setTimeout(
  keepTabsVisible,
  300
);


setTimeout(
  keepTabsVisible,
  800
);


setTimeout(
  keepTabsVisible,
  1500
);


setInterval(
  keepTabsVisible,
  2000
);


window.addEventListener(
  'resize',
  keepTabsVisible
);


window.addEventListener(
  'focus',
  keepTabsVisible
);


new MutationObserver(
  keepTabsVisible
).observe(
  document.documentElement,
  {
    childList:true,
    subtree:true,
    attributes:true,
    attributeFilter:[
      'class',
      'style'
    ]
  }
);

})();
<\/script>`;


    const marker=
      /const addon=decodeURIComponent\\(escape\\(atob\\('([^']+)'\\)\\)\\);/;


    if(!marker.test(source)){

      throw new Error(
        'Working app marker not found'
      );

    }


    source=source.replace(

      marker,

      function(all,b64){

        return

          "const addon=decodeURIComponent(escape(atob('"

          +b64+

          "')))+"

          +JSON.stringify(patch)

          +";";

      }

    );


    document.open();

    document.write(source);

    document.close();


  }catch(err){

    console.error(err);

    boot.innerHTML=

      '<div class="readyBox">'+

      '<div class="logo">FW</div>'+

      '<h1>Freshwater Surf Boat Program</h1>'+

      '<p>The program could not load. Please refresh once.</p>'+

      '</div>';

  }

})();
</script>

</body>
</html>
